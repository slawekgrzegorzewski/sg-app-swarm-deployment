events{}

http {

    include /etc/nginx/mime.types;
	
	upstream backend {
		server sg-application_backend:8080;
	}

	server {
        listen 443 ssl;
        server_name be.grzegorzewski.pl www.be.grzegorzewski.pl;
        ssl_certificate     /run/secrets/sgapplication2.crt;
        ssl_certificate_key /run/secrets/sgapplication2.key;

		location / {
			proxy_set_header Host $http_host;
			proxy_redirect off;
			proxy_pass http://backend;
			client_max_body_size 10m;
		}
    }

	server {
        listen 443 ssl;
        server_name grzegorzewski.pl www.grzegorzewski.pl;
        ssl_certificate     /run/secrets/sgapplication2.crt;
        ssl_certificate_key /run/secrets/sgapplication2.key;

        root /usr/share/nginx/react;
        index index.html;

		location /be {
		    rewrite /be/(.*) /$1 break;
			proxy_set_header Host $http_host;
			proxy_redirect off;
			proxy_pass http://backend;
		}

		location = /react {
			return 404;
		}

		location ^~ /react/ {
			return 404;
		}

		location /mpc {
            alias /usr/share/nginx/mobipetcare;
            index index.html;
		}

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
