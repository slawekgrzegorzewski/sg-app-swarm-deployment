events{}

http {

    include /etc/nginx/mime.types;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

	server {
        listen 443 ssl;
        server_name public.registry.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

		location /v2/ {
		    client_max_body_size 2G;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

			proxy_redirect off;

			# Public registry endpoint: GET and HEAD only. Docker image pulls use
			# these methods; uploads must use the authenticated private registry.
			limit_except GET {
				deny all;
			}

			set $registry_upstream core_registry:5000;
			proxy_pass http://$registry_upstream;
		}

		location / {
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_redirect off;
			limit_except GET {
				deny all;
			}
			set $registry_upstream core_registry:5000;
			proxy_pass http://$registry_upstream;
			proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
		}
    }

	server {
        listen 443 ssl;
        server_name private.registry.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

		# Private registry endpoint: Basic Auth applies to GET /v2/ too, so
		# Docker receives the challenge required by `docker login`.
		location / {
			client_max_body_size 2G;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
			proxy_redirect off;
			auth_basic "Registry push access";
			auth_basic_user_file /run/secrets/htpasswd;
			set $registry_upstream core_registry:5000;
			proxy_pass http://$registry_upstream;
			proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
		}
    }

    server {
        listen 80;

        server_name mobipetcare.pl www.mobipetcare.pl;

        root /usr/share/nginx/mobipetcare;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

	server {
        listen 80;
        server_name grzegorzewski.pl www.grzegorzewski.pl public.registry.grzegorzewski.pl private.registry.grzegorzewski.pl;

	    location ^~ /.well-known/acme-challenge/ {
    		default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
	    }

	    location = /.well-known/acme-challenge/ {
		    return 404;
	    }
	}

	server {
        listen 443 ssl;
        server_name be.grzegorzewski.pl www.be.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

		location / {
			proxy_set_header Host $http_host;
			proxy_redirect off;
			set $backend_upstream application_backend:8080;
			proxy_pass http://$backend_upstream;
			client_max_body_size 10m;
		}
	}

    server {
        listen 443 ssl;
        server_name grafana.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            set $grafana_upstream infrastructure_grafana:3000;
            proxy_pass http://$grafana_upstream;
        }
    }

	server {
        listen 443 ssl;
        server_name portainer.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_ssl_verify off;
            proxy_redirect off;
            set $portainer_upstream infrastructure_portainer:9443;
            proxy_pass https://$portainer_upstream;
        }
    }

	server {
        listen 443 ssl;
        server_name grzegorzewski.pl www.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

		location /be {
		    rewrite /be/(.*) /$1 break;
			proxy_set_header Host $http_host;
			proxy_redirect off;
			set $backend_upstream application_backend:8080;
			proxy_pass http://$backend_upstream;
		}

		location = /react {
			return 404;
		}

		location ^~ /react/ {
			return 404;
		}

		location /mpc {
            alias /usr/share/nginx/mobipetcare;
            index index.html;
		}

        location / {
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_redirect off;
			set $frontend_upstream application_frontend:80;
			proxy_pass http://$frontend_upstream;
		}
	}

	server {
        listen 80;
        server_name be.grzegorzewski.pl www.be.grzegorzewski.pl;

	    location ^~ /.well-known/acme-challenge/ {
    		default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
	    }

	    location = /.well-known/acme-challenge/ {
		    return 404;
	    }
    }

    server {
        listen 80;
        server_name grafana.grzegorzewski.pl;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
        }

        location = /.well-known/acme-challenge/ {
            return 404;
        }
    }

    server {
        listen 80;
        server_name portainer.grzegorzewski.pl;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
        }

        location = /.well-known/acme-challenge/ {
            return 404;
        }
    }

	server {
        listen 80;
        server_name mail.grzegorzewski.pl www.mail.grzegorzewski.pl;

	    location ^~ /.well-known/acme-challenge/ {
    		default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
	    }

	    location = /.well-known/acme-challenge/ {
		    return 404;
	    }
    }
}
