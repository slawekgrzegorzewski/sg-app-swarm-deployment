events{}

http {

    include /etc/nginx/mime.types;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name vault.grzegorzewski.pl;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
        }

        location / {
            return 301 https://vault.grzegorzewski.pl$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name vault.grzegorzewski.pl;
        ssl_certificate /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;
        client_max_body_size 525m;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            set $vaultwarden_upstream application_vaultwarden:8080;
            proxy_pass http://$vaultwarden_upstream;
        }
    }

	server {
        listen 443 ssl;
        server_name public.registry.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

		location /v2/ {
		    client_max_body_size 2G;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

			proxy_redirect off;

			# Public registry endpoint: GET and HEAD only. Docker image pulls use
			# these methods; uploads must use the authenticated private registry.
			limit_except GET {
				deny all;
			}

			set $registry_upstream core_registry:5000;
			proxy_pass http://$registry_upstream;
		}

		location / {
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_redirect off;
			limit_except GET {
				deny all;
			}
			set $registry_upstream core_registry:5000;
			proxy_pass http://$registry_upstream;
			proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
		}
    }

	server {
        listen 443 ssl;
        server_name private.registry.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

		# Private registry endpoint: Basic Auth applies to GET /v2/ too, so
		# Docker receives the challenge required by `docker login`.
		location / {
			client_max_body_size 2G;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
			proxy_redirect off;
			auth_basic "Registry push access";
			auth_basic_user_file /run/secrets/htpasswd;
			set $registry_upstream core_registry:5000;
			proxy_pass http://$registry_upstream;
			proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
		}
    }

    server {
        listen 80;
        server_name mcp.grzegorzewski.pl;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
        }

        location / {
            return 308 https://mcp.grzegorzewski.pl$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name mcp.grzegorzewski.pl;
        ssl_certificate /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_redirect off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            set $mcp_upstream application_mcp:8080;
            proxy_pass http://$mcp_upstream;
        }
    }

    server {
        listen 443 ssl;
        server_name auth.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_redirect off;
            set $keycloak_upstream application_keycloak:8080;
            proxy_pass http://$keycloak_upstream;
        }
    }

	server {
        listen 443 ssl;
        server_name be.grzegorzewski.pl www.be.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

		location / {
			proxy_set_header Host $http_host;
			proxy_redirect off;
			set $backend_upstream application_backend:8080;
			proxy_pass http://$backend_upstream;
			client_max_body_size 10m;
		}
	}

    server {
        listen 80;
        server_name pgadmin.grzegorzewski.pl;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
        }

        location / {
            return 308 https://pgadmin.grzegorzewski.pl$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name pgadmin.grzegorzewski.pl;
        ssl_certificate /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Scheme "";
            proxy_set_header X-Script-Name "";
            proxy_redirect off;
            set $pgadmin_upstream database_pgadmin:80;
            proxy_pass http://$pgadmin_upstream;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            set $grafana_upstream infrastructure_grafana:3000;
            proxy_pass http://$grafana_upstream;
        }
    }

	server {
        listen 443 ssl;
        server_name portainer.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_ssl_verify off;
            proxy_redirect off;
            set $portainer_upstream infrastructure_portainer:9443;
            proxy_pass https://$portainer_upstream;
        }
    }

	server {
        listen 443 ssl;
        server_name grzegorzewski.pl www.grzegorzewski.pl;
        ssl_certificate     /run/secrets/gateway.crt;
        ssl_certificate_key /run/secrets/gateway.key;

        location / {
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_redirect off;
			set $frontend_upstream application_frontend:80;
			proxy_pass http://$frontend_upstream;
		}
	}

	server {
        listen 80;
        server_name
            grzegorzewski.pl
            www.grzegorzewski.pl
            public.registry.grzegorzewski.pl
            private.registry.grzegorzewski.pl
            auth.grzegorzewski.pl
            be.grzegorzewski.pl
            www.be.grzegorzewski.pl
            grafana.grzegorzewski.pl
            portainer.grzegorzewski.pl
            mail.grzegorzewski.pl
            www.mail.grzegorzewski.pl;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
        }

        location = /.well-known/acme-challenge/ {
            return 404;
        }
    }
}
