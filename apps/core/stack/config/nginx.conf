events{}

http {

    include /etc/nginx/mime.types;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

	upstream registry {
		server core_zot:5000;
	}

	upstream backend {
		server sg-application_backend:8080;
	}

	server {
        listen 5005 ssl;
        server_name grzegorzewski.pl www.grzegorzewski.pl;
        ssl_certificate     /run/secrets/sgapplication2.crt;
        ssl_certificate_key /run/secrets/sgapplication2.key;

		location /v2/ {
		    client_max_body_size 2G;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # These headers are required for Docker to trust the registry
            # certificate and enable client-side certificate validation
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/secrets/sgapplication.crt;
            proxy_ssl_session_reuse off;

			proxy_redirect off;

            auth_basic off;

            limit_except GET {
                auth_basic           "Registry write access";
                auth_basic_user_file /auth/htpasswd;
            }

			proxy_pass http://registry;
		}

		location / {
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_redirect off;
			auth_basic "Restricted";
			auth_basic_user_file /auth/htpasswd;
			proxy_pass http://registry;
			proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
		}
    }

    server {
        listen 80;

        server_name mobipetcare.pl www.mobipetcare.pl;

        root /usr/share/nginx/mobipetcare;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

	server {
        listen 80;
        server_name grzegorzewski.pl www.grzegorzewski.pl;

	    location ^~ /.well-known/acme-challenge/ {
    		default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
	    }

	    location = /.well-known/acme-challenge/ {
		    return 404;
	    }
	}

	server {
        listen 443 ssl;
        server_name be.grzegorzewski.pl www.be.grzegorzewski.pl;
        ssl_certificate     /run/secrets/sgapplication2.crt;
        ssl_certificate_key /run/secrets/sgapplication2.key;

		location / {
			proxy_set_header Host $http_host;
			proxy_redirect off;
			proxy_pass http://backend;
			client_max_body_size 10m;
		}
	}

	server {
        listen 443 ssl;
        server_name grzegorzewski.pl www.grzegorzewski.pl;
        ssl_certificate     /run/secrets/sgapplication2.crt;
        ssl_certificate_key /run/secrets/sgapplication2.key;

        root /usr/share/nginx/react;
        index index.html;

		location /be {
		    rewrite /be/(.*) /$1 break;
			proxy_set_header Host $http_host;
			proxy_redirect off;
			proxy_pass http://backend;
		}

		location = /react {
			return 404;
		}

		location ^~ /react/ {
			return 404;
		}

		location /mpc {
            alias /usr/share/nginx/mobipetcare;
            index index.html;
		}

        location / {
            try_files $uri $uri/ /index.html;
	}
}

	server {
        listen 80;
        server_name be.grzegorzewski.pl www.be.grzegorzewski.pl;

	    location ^~ /.well-known/acme-challenge/ {
    		default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
	    }

	    location = /.well-known/acme-challenge/ {
		    return 404;
	    }
    }

	server {
        listen 80;
        server_name mail.grzegorzewski.pl www.mail.grzegorzewski.pl;

	    location ^~ /.well-known/acme-challenge/ {
    		default_type "text/plain";
            root /usr/share/nginx/letsencrypt;
	    }

	    location = /.well-known/acme-challenge/ {
		    return 404;
	    }
    }
}
