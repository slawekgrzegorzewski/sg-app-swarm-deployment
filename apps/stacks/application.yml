version: '3.8'

x-syslog-options: &syslog_options
  syslog-address: ${LOGGING_SYSLOG_ADDRESS}
  syslog-format: rfc5424
  mode: non-blocking
  max-buffer-size: 4m

x-syslog-logging: &syslog_logging
  driver: syslog
  options: *syslog_options

services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    user: '1000:1000'
    environment:
      DOMAIN: https://vault.grzegorzewski.pl
      ROCKET_PORT: '8080'
      SIGNUPS_ALLOWED: 'false'
      INVITATIONS_ALLOWED: 'true'
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: '587'
      SMTP_SECURITY: starttls
      SMTP_USERNAME: af0e36001@smtp-brevo.com
      SMTP_FROM: noreply@grzegorzewski.pl
      SMTP_FROM_NAME: Vaultwarden
      SMTP_PASSWORD_FILE: /run/secrets/brevo_smtp_password
      TZ: Europe/Warsaw
    secrets:
      - source: vaultwarden_admin_token
        uid: '1000'
        gid: '1000'
        mode: 0400
      - source: brevo_smtp_password
        uid: '1000'
        gid: '1000'
        mode: 0400
    volumes:
      - type: bind
        source: /srv/cluster/data/vaultwarden
        target: /data
    networks:
      - application_network
    logging:
      <<: *syslog_logging
      options:
        <<: *syslog_options
        tag: application_vaultwarden
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload.vaultwarden == true
      resources:
        limits:
          memory: 512M
      update_config:
        order: stop-first
        failure_action: rollback
      rollback_config:
        order: stop-first

  frontend:
    image: public.registry.grzegorzewski.pl/frontend:${FRONTEND_IMAGE_TAG:-latest}
    networks:
      - application_network
    logging:
      <<: *syslog_logging
      options:
        <<: *syslog_options
        tag: application_frontend
    deploy:
      placement:
        constraints:
          - node.labels.workload.application == true
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: stop-first

  backend:
    image: public.registry.grzegorzewski.pl/backend:${BACKEND_IMAGE_TAG:-latest}
    environment:
      spring_profiles_active: http
    configs:
      - source: backend_application_config
        target: /app/application.yml
      - source: backend_logback_config
        target: /app/logback.xml
    secrets:
      - jwt_secret_code
      - sendgrid_api_key
      - nordigen_secret_id
      - nordigen_secret_key
      - accountant_db_password
      - pjm_downloader_aws_access_key_id
      - pjm_downloader_aws_secret_access_key
      - intellectual_property_s3_aws_access_key_id
      - intellectual_property_s3_aws_secret_access_key
      - sns-client-access-key-id
      - sns-client-access-key
      - aws_region
      - aws_pjm_lambda_function
      - aws_pjm_sns_topic_arn
      - random_org_api_key
      - brevo_smtp_password
    networks:
      - application_network
    logging:
      <<: *syslog_logging
      options:
        <<: *syslog_options
        tag: application_backend
    deploy:
      placement:
        constraints:
          - node.labels.workload.application == true

  banks:
    image: public.registry.grzegorzewski.pl/banks:${BANKS_IMAGE_TAG:-latest}
    configs:
      - source: banks_application_config
        target: /app/application.yml
      - source: banks_logback_config
        target: /app/logback.xml
    secrets:
      - jwt_secret_code
      - go_cardless_secret_id
      - go_cardless_secret_key
      - sns-client-access-key-id
      - sns-client-access-key
      - aws_region
      - aws_banks_sns_topic_arn
      - banks_db_password
      - brevo_smtp_password
      - notification_email_to
    networks:
      - application_network
    logging:
      <<: *syslog_logging
      options:
        <<: *syslog_options
        tag: application_banks
    deploy:
      placement:
        constraints:
          - node.labels.workload.application == true

  mcp:
    image: public.registry.grzegorzewski.pl/mcp:${MCP_IMAGE_TAG:-latest}
    environment:
      ACCOUNTANT_GRAPHQL_URL: http://application_backend:8080/graphql
    networks:
      - application_network
    logging:
      <<: *syslog_logging
      options:
        <<: *syslog_options
        tag: application_mcp
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload.application == true
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: stop-first

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database_postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_HOSTNAME: https://auth.grzegorzewski.pl
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      TZ: Europe/Warsaw
    configs:
      - source: keycloak_start_script
        target: /usr/local/bin/start-keycloak
        uid: '1000'
        gid: '0'
        mode: 0550
      - source: keycloak_realm
        target: /opt/keycloak/data/import/sg-realm.json
        uid: '1000'
        gid: '0'
        mode: 0444
      - source: keycloak_test_realm
        target: /opt/keycloak/data/import/sg-test-realm.json
        uid: '1000'
        gid: '0'
        mode: 0444
    secrets:
      - keycloak_db_password
      - keycloak_bootstrap_admin_password
      - keycloak_google_client_id
      - keycloak_google_client_secret
      - keycloak_mcp_chatgpt_client_secret
      - brevo_smtp_password
    networks:
      - application_network
    logging:
      <<: *syslog_logging
      options:
        <<: *syslog_options
        tag: application_keycloak
    entrypoint:
      - /bin/sh
      - /usr/local/bin/start-keycloak
    deploy:
      placement:
        constraints:
          - node.labels.workload.application == true
      replicas: 1
      resources:
        limits:
          memory: 1G
      update_config:
        order: stop-first
        failure_action: rollback
      rollback_config:
        order: stop-first

  tapo-reader:
    image: public.registry.grzegorzewski.pl/tapo:${TAPO:-latest}
    secrets:
      - smart_home_db_host
      - smart_home_db_password
      - tapo_user
      - tapo_password
      - tapo_device_ip
    networks:
      - application_network
    logging:
      <<: *syslog_logging
      options:
        <<: *syslog_options
        tag: application_tapo-reader
    deploy:
      labels:
        - swarm.cronjob.enable=true
        - swarm.cronjob.schedule=* * * * *
        - swarm.cronjob.skip-running=false
      placement:
        constraints:
          - node.labels.workload.application == true
      restart_policy:
        condition: none

configs:
  backend_application_config:
    template_driver: golang
    file: ../configs/application/application.yml.tmpl
    name: backend_application_${CONFIG_VERSION:-0}
  banks_application_config:
    template_driver: golang
    file: ../configs/application/application-banks.yml.tmpl
    name: banks_application_${CONFIG_VERSION:-0}
  backend_logback_config:
    file: ../configs/application/logback.xml
    name: backend_logback_${CONFIG_VERSION:-0}
  banks_logback_config:
    file: ../configs/application/logback-banks.xml
    name: banks_logback_${CONFIG_VERSION:-0}
  keycloak_start_script:
    file: ../configs/application/start-keycloak.sh
    name: keycloak_start_${CONFIG_VERSION:-0}
  keycloak_realm:
    file: ../configs/application/sg-realm.json
    name: keycloak_realm_${CONFIG_VERSION:-0}
  keycloak_test_realm:
    file: ../configs/application/sg-test-realm.json
    name: keycloak_test_realm_${CONFIG_VERSION:-0}

secrets:
  vaultwarden_admin_token:
    external: true
  jwt_secret_code:
    external: true
  keycloak_db_password:
    external: true
  keycloak_bootstrap_admin_password:
    external: true
  keycloak_google_client_id:
    external: true
  keycloak_google_client_secret:
    external: true
  keycloak_mcp_chatgpt_client_secret:
    external: true
  sendgrid_api_key:
    external: true
  go_cardless_secret_id:
    external: true
  go_cardless_secret_key:
    external: true
  nordigen_secret_id:
    external: true
  nordigen_secret_key:
    external: true
  accountant_db_password:
    external: true
  banks_db_password:
    external: true
  intellectual_property_s3_aws_access_key_id:
    external: true
  intellectual_property_s3_aws_secret_access_key:
    external: true
  pjm_downloader_aws_access_key_id:
    external: true
  pjm_downloader_aws_secret_access_key:
    external: true
  sns-client-access-key-id:
    external: true
  sns-client-access-key:
    external: true
  aws_region:
    external: true
  aws_pjm_lambda_function:
    external: true
  aws_pjm_sns_topic_arn:
    external: true
  aws_banks_sns_topic_arn:
    external: true
  brevo_smtp_password:
    external: true
  random_org_api_key:
    external: true
  notification_email_to:
    external: true
  smart_home_db_host:
    external: true
  smart_home_db_password:
    external: true
  tapo_user:
    external: true
  tapo_password:
    external: true
  tapo_device_ip:
    external: true

networks:
  application_network:
    external: true
