version: '3.8'

services:
  backend:
    image: grzegorzewski.pl:5005/backend:latest
    ports:
      - '8080:8080'
    environment:
      spring_profiles_active: http
    configs:
      - source: backend_application_config
        target: /app/application.yml
      - source: backend_logback_config
        target: /app/logback.xml
    secrets:
      - jwt_secret_code
      - sendgrid_api_key
      - nordigen_secret_id
      - nordigen_secret_key
      - accountant_db_password
      - pjm_downloader_aws_access_key_id
      - pjm_downloader_aws_secret_access_key
      - intellectual_property_s3_aws_access_key_id
      - intellectual_property_s3_aws_secret_access_key
      - sns-client-access-key-id
      - sns-client-access-key
      - aws_region
      - aws_pjm_lambda_function
      - aws_pjm_sns_topic_arn
      - random_org_api_key
      - brevo_smtp_password
    volumes:
      - type: bind
        source: /srv/cluster/logs/backend
        target: /app/logs
    networks:
      - application_network
    deploy:
      placement:
        constraints:
          - node.labels.workload.application == true

  banks:
    image: grzegorzewski.pl:5005/banks:latest
    ports:
      - '8081:8080'
    configs:
      - source: banks_application_config
        target: /app/application.yml
      - source: banks_logback_config
        target: /app/logback.xml
    secrets:
      - jwt_secret_code
      - go_cardless_secret_id
      - go_cardless_secret_key
      - sns-client-access-key-id
      - sns-client-access-key
      - aws_region
      - aws_banks_sns_topic_arn
      - banks_db_password
      - brevo_smtp_password
      - notification_email_to
    volumes:
      - type: bind
        source: /srv/cluster/logs/banks
        target: /app/logs
    networks:
      - application_network
    deploy:
      placement:
        constraints:
          - node.labels.workload.application == true

configs:
  backend_application_config:
    template_driver: golang
    file: ../configs/application/application.yml.tmpl
    name: backend_application_${CONFIG_VERSION:-0}
  banks_application_config:
    template_driver: golang
    file: ../configs/application/application-banks.yml.tmpl
    name: banks_application_${CONFIG_VERSION:-0}
  backend_logback_config:
    file: ../configs/application/logback.xml
    name: backend_logback_${CONFIG_VERSION:-0}
  banks_logback_config:
    file: ../configs/application/logback-banks.xml
    name: banks_logback_${CONFIG_VERSION:-0}

secrets:
  jwt_secret_code:
    external: true
  sendgrid_api_key:
    external: true
  go_cardless_secret_id:
    external: true
  go_cardless_secret_key:
    external: true
  nordigen_secret_id:
    external: true
  nordigen_secret_key:
    external: true
  accountant_db_password:
    external: true
  banks_db_password:
    external: true
  intellectual_property_s3_aws_access_key_id:
    external: true
  intellectual_property_s3_aws_secret_access_key:
    external: true
  pjm_downloader_aws_access_key_id:
    external: true
  pjm_downloader_aws_secret_access_key:
    external: true
  sns-client-access-key-id:
    external: true
  sns-client-access-key:
    external: true
  aws_region:
    external: true
  aws_pjm_lambda_function:
    external: true
  aws_pjm_sns_topic_arn:
    external: true
  aws_banks_sns_topic_arn:
    external: true
  brevo_smtp_password:
    external: true
  random_org_api_key:
    external: true
  notification_email_to:
    external: true

networks:
  application_network:
    external: true
