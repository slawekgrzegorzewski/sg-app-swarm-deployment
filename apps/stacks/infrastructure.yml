version: '3.8'

x-docker-json-logging: &docker_json_logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  loki:
    image: grafana/loki:3.7.2
    command:
      - -config.file=/etc/loki/config.yml
    configs:
      - source: loki_config
        target: /etc/loki/config.yml
    volumes:
      - /srv/cluster/data/loki:/loki
    networks:
      - observability_network
    logging: *docker_json_logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    networks:
      - observability_network
    ports:
      - target: 1514
        published: 1514
        protocol: tcp
        mode: host
    logging: *docker_json_logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        uid: '65534'
        gid: '65534'
        mode: 0444
    volumes:
      - /srv/cluster/data/prometheus:/prometheus
    networks:
      - observability_network
    logging: *docker_json_logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_DOMAIN: grafana.grzegorzewski.pl
      GF_SERVER_ROOT_URL: https://grafana.grzegorzewski.pl/
    secrets:
      - grafana_admin_password
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
        uid: '472'
        gid: '472'
        mode: 0444

      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
        uid: '472'
        gid: '472'
        mode: 0444

      - source: grafana_dashboard_swarm_monitoring
        target: /etc/grafana/provisioning/dashboards/files/swarm-monitoring.json
        uid: '472'
        gid: '472'
        mode: 0444
    volumes:
      - /srv/cluster/data/grafana:/var/lib/grafana
    networks:
      - observability_network
    logging: *docker_json_logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  portainer:
    image: portainer/portainer-ce:lts
    command:
      - -H
      - tcp://tasks.portainer-agent:9001
      - --tlsskipverify
      - --admin-password-file
      - /run/secrets/portainer_admin_password
    secrets:
      - portainer_admin_password
    volumes:
      - /srv/cluster/data/portainer:/data
    networks:
      - portainer_agent_network
      - observability_network
    logging: *docker_json_logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  portainer-agent:
    image: portainer/agent:lts
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - portainer_agent_network
    logging: *docker_json_logging
    deploy:
      mode: global
      restart_policy:
        condition: any

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    hostname: "{{.Node.Hostname}}"
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - observability_network
    logging: *docker_json_logging
    deploy:
      mode: global
      endpoint_mode: dnsrr
      restart_policy:
        condition: any

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    cap_add:
      - SYS_ADMIN
      - SYSLOG
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /dev/kmsg:/dev/kmsg:ro
    networks:
      - observability_network
    logging: *docker_json_logging
    deploy:
      mode: global
      endpoint_mode: dnsrr
      restart_policy:
        condition: any

configs:
  alloy_config:
    file: ../configs/infrastructure/alloy.alloy
    name: alloy_config_${CONFIG_VERSION:-0}
  loki_config:
    file: ../configs/infrastructure/loki.yml
    name: loki_config_${CONFIG_VERSION:-0}
  prometheus_config:
    file: ../configs/infrastructure/prometheus.yml
    name: prometheus_config_${CONFIG_VERSION:-0}
  grafana_datasources:
    file: ../configs/infrastructure/grafana-datasources.yml
    name: grafana_datasources_${CONFIG_VERSION:-0}
  grafana_dashboards:
    file: ../configs/infrastructure/grafana-dashboards.yml
    name: grafana_dashboards_${CONFIG_VERSION:-0}
  grafana_dashboard_swarm_monitoring:
    file: ../configs/infrastructure/dashboards/swarm-monitoring.json
    name: grafana_dashboard_swarm_monitoring_${CONFIG_VERSION:-0}

secrets:
  grafana_admin_password:
    external: true
  portainer_admin_password:
    external: true

networks:
  observability_network:
    external: true
  portainer_agent_network:
    driver: overlay
