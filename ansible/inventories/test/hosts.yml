all:
  children:
    bootstrap_hosts:
      hosts:
        PC2:
          ansible_host: ansible-test-swarm-manager
          docker_swarm_advertise_addr: 192.168.56.10
        rpi5:
          ansible_host: ansible-test-swarm-node-1
          docker_swarm_advertise_addr: 192.168.56.11
        rpi4:
          ansible_host: ansible-test-swarm-node-2
          docker_swarm_advertise_addr: 192.168.56.12
        rpi3:
          ansible_host: ansible-test-swarm-node-3
          docker_swarm_advertise_addr: 192.168.56.13
    swarm_managers:
      hosts:
        PC2:
    swarm_workers:
      hosts:
        rpi5:
        rpi4:
        rpi3:
    postgres_nodes:
      hosts:
        rpi3:
    registry_nodes:
      hosts:
        rpi4:
  vars:
    ansible_user: slawek
    base_host_ssh_private_key_directory: ansible-test
    base_host_ssh_config_hosts:
      - ansible-test-swarm-manager*
      - ansible-test-swarm-node-*
