---
- name: Validate Bitwarden item and unique Docker secret names
  ansible.builtin.assert:
    that:
      - docker_swarm_secrets_bitwarden_item is string
      - docker_swarm_secrets_bitwarden_item | length > 0
      - docker_swarm_secrets | map(attribute='name') | unique | length == docker_swarm_secrets | length
    fail_msg: "Configure one Bitwarden item name or UUID and unique Docker secret names."
    quiet: true

- name: Validate Docker Swarm secret definitions
  ansible.builtin.assert:
    that:
      - docker_swarm_secrets | length > 0
      - item.name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - item.field is string
      - item.field | length > 0
      - item.encoding | default('plain') in ['plain', 'base64']
    fail_msg: "Invalid Docker Swarm secret definition: {{ item }}"
  loop: "{{ docker_swarm_secrets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Verify Docker Swarm manager availability
  ansible.builtin.command:
    cmd: docker info --format '{% raw %}{{.Swarm.ControlAvailable}}{% endraw %}'
  register: docker_swarm_secrets_manager_state
  changed_when: false
  check_mode: false
  failed_when: docker_swarm_secrets_manager_state.stdout | trim != 'true'

- name: Verify that the Bitwarden CLI is installed on the Ansible controller
  ansible.builtin.command:
    argv:
      - "{{ docker_swarm_secrets_bitwarden_cli }}"
      - --version
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false

- name: Create the cluster command directory
  ansible.builtin.file:
    path: "{{ docker_swarm_secrets_script | dirname }}"
    state: directory
    owner: root
    group: "{{ cluster_admin_user }}"
    mode: '0755'

- name: Install the Docker Swarm secrets creation script
  ansible.builtin.template:
    src: create-docker-secrets.sh.j2
    dest: "{{ docker_swarm_secrets_script }}"
    owner: root
    group: "{{ cluster_admin_user }}"
    mode: '0750'

- name: Explain Docker secret changes skipped during check mode
  ansible.builtin.debug:
    msg: >-
      Docker Swarm secret usage is not checked and secrets are not read from
      Bitwarden or changed in check mode.
  when: ansible_check_mode

- name: Select managed secrets that can be safely created or updated
  ansible.builtin.command:
    argv: >-
      {{
        [docker_swarm_secrets_script, '--preflight'] +
        (docker_swarm_secrets | map(attribute='name') | list)
      }}
  become: true
  become_user: "{{ cluster_admin_user }}"
  register: docker_swarm_secrets_eligible
  changed_when: false
  when: not ansible_check_mode

- name: Explain secrets skipped because active services use them
  ansible.builtin.debug:
    msg: "{{ docker_swarm_secrets_eligible.stderr_lines }}"
  when:
    - not ansible_check_mode
    - docker_swarm_secrets_eligible.stderr | length > 0

- name: Verify that the local Bitwarden vault is unlocked
  ansible.builtin.command:
    argv:
      - "{{ docker_swarm_secrets_bitwarden_cli }}"
      - status
      - --nointeraction
  delegate_to: localhost
  become: false
  register: docker_swarm_secrets_bitwarden_status
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - docker_swarm_secrets_eligible.stdout_lines | length > 0

- name: Require an unlocked Bitwarden session on the Ansible controller
  ansible.builtin.assert:
    that:
      - (docker_swarm_secrets_bitwarden_status.stdout | from_json).status == 'unlocked'
    fail_msg: "Unlock the Bitwarden vault on the Ansible controller and export BW_SESSION before applying secrets."
    quiet: true
  when:
    - not ansible_check_mode
    - docker_swarm_secrets_eligible.stdout_lines | length > 0

- name: Synchronize the local Bitwarden vault
  ansible.builtin.command:
    argv:
      - "{{ docker_swarm_secrets_bitwarden_cli }}"
      - sync
      - --nointeraction
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - docker_swarm_secrets_eligible.stdout_lines | length > 0

- name: Read the Bitwarden item on the Ansible controller
  ansible.builtin.command:
    argv:
      - "{{ docker_swarm_secrets_bitwarden_cli }}"
      - get
      - item
      - "{{ docker_swarm_secrets_bitwarden_item }}"
      - --raw
      - --nointeraction
  delegate_to: localhost
  become: false
  register: docker_swarm_secrets_from_bitwarden
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - docker_swarm_secrets_eligible.stdout_lines | length > 0

- name: Explain a failed Bitwarden item read without exposing vault data
  ansible.builtin.fail:
    msg: >-
      Nie udało się odczytać wpisu Bitwarden (kod {{ docker_swarm_secrets_from_bitwarden.rc | default(1) }}).
      {{
        'Nazwa pasuje do kilku wpisów; wskaż UUID właściwego wpisu.'
        if bitwarden_error is search('more than one|multiple results?')
        else 'Nie znaleziono wpisu; sprawdź nazwę, konto i dostęp do kolekcji.'
        if bitwarden_error is search('not found|no results?')
        else 'Sesja sejfu jest zablokowana lub nieważna; ponownie odblokuj bw i ustaw BW_SESSION.'
        if bitwarden_error is search('locked|invalid session|session.*invalid')
        else 'Sprawdź lokalną sesję bw oraz wyszukaj UUID wpisu poleceniem opisanym w ansible/README.md.'
      }}
      Surowy komunikat CLI został ukryty, ponieważ może zawierać dane sejfu.
  vars:
    bitwarden_error: >-
      {{
        ((docker_swarm_secrets_from_bitwarden.stderr | default('')) ~ ' ' ~
        (docker_swarm_secrets_from_bitwarden.stdout | default(''))) | lower
      }}
  when:
    - not ansible_check_mode
    - docker_swarm_secrets_eligible.stdout_lines | length > 0
    - docker_swarm_secrets_from_bitwarden.rc | default(1) != 0

- name: Verify the exact Bitwarden item name or UUID
  ansible.builtin.assert:
    that:
      - bitwarden_item.id == docker_swarm_secrets_bitwarden_item or bitwarden_item.name == docker_swarm_secrets_bitwarden_item
    fail_msg: "Bitwarden returned an item with a different name or UUID."
    quiet: true
  vars:
    bitwarden_item: "{{ docker_swarm_secrets_from_bitwarden.stdout | from_json }}"
  no_log: true
  when:
    - not ansible_check_mode
    - docker_swarm_secrets_eligible.stdout_lines | length > 0

- name: Validate every required Bitwarden field before changing Docker secrets
  ansible.builtin.assert:
    that:
      - bitwarden_fields | length == 1
      - bitwarden_fields[0].value is string
      - bitwarden_fields[0].value | trim | length > 0
    fail_msg: "A required Bitwarden field is missing, empty or duplicated."
    quiet: true
  vars:
    bitwarden_fields: >-
      {{
        (docker_swarm_secrets_from_bitwarden.stdout | from_json).fields
        | default([], true)
        | selectattr('name', 'equalto', item.field)
        | list
      }}
  loop: >-
    {{ docker_swarm_secrets | selectattr('name', 'in', docker_swarm_secrets_eligible.stdout_lines | default([])) | list }}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: not ansible_check_mode

- name: Create or update Docker Swarm secrets
  ansible.builtin.command:
    argv:
      - "{{ docker_swarm_secrets_script }}"
      - --apply
      - "{{ item.name }}"
    stdin: >-
      {{
        (bitwarden_value | b64decode)
        if item.encoding | default('plain') == 'base64'
        else bitwarden_value
      }}
    stdin_add_newline: false
  vars:
    bitwarden_value: >-
      {{
        (docker_swarm_secrets_from_bitwarden.stdout | from_json).fields
        | selectattr('name', 'equalto', item.field)
        | map(attribute='value')
        | first
      }}
  become: true
  become_user: "{{ cluster_admin_user }}"
  loop: >-
    {{ docker_swarm_secrets | selectattr('name', 'in', docker_swarm_secrets_eligible.stdout_lines | default([])) | list }}
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  no_log: true
  when: not ansible_check_mode
