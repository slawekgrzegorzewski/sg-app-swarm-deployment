---
- name: Prepare cluster hosts with base Linux and Docker Engine
  hosts: bootstrap_hosts
  gather_facts: true
  roles:
    - role: base_host
    - role: docker_engine
    - role: cluster_layout

- name: Install manager-local backup workflows
  hosts: swarm_managers
  become: true
  gather_facts: false
  tasks:
    - name: Install backup scheduler and transfer dependency
      ansible.builtin.apt:
        name:
          - cron
          - rsync
        state: present

    - name: Enable cron scheduler
      ansible.builtin.systemd_service:
        name: cron
        enabled: true
        state: started

    - name: Create Grafana backup directory
      ansible.builtin.file:
        path: "{{ cluster_root }}/backups/grafana"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Install the local Grafana backup script
      ansible.builtin.template:
        src: backup_grafana.sh.j2
        dest: "{{ cluster_root }}/bin/backup_grafana.sh"
        owner: root
        group: root
        mode: '0750'

    - name: Schedule nightly Grafana backup
      ansible.builtin.cron:
        name: Backup Grafana SQLite database
        user: root
        minute: '30'
        hour: '2'
        job: "{{ cluster_root }}/bin/backup_grafana.sh"

    - name: Install the PostgreSQL backup transfer script
      ansible.builtin.template:
        src: transfer_postgres_backups.sh.j2
        dest: "{{ cluster_root }}/bin/transfer_postgres_backups.sh"
        owner: root
        group: "{{ cluster_admin_user }}"
        mode: '0750'
      vars:
        postgres_backup_source_host: >-
          {{ hostvars[groups['postgres_nodes'] | first].ansible_host
             | default(groups['postgres_nodes'] | first) }}

    - name: Schedule PostgreSQL backup transfer after every full hour
      ansible.builtin.cron:
        name: Transfer PostgreSQL backups to the manager
        user: "{{ cluster_admin_user }}"
        minute: '30'
        hour: '*'
        job: "{{ cluster_root }}/bin/transfer_postgres_backups.sh"
