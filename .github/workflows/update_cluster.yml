name: update cluster

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cluster-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: zulu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
        with:
          gradle-version: '9.6.1'

      - name: Build release archive
        run: |
          ./gradlew clusterRelease
          cp build/distributions/cluster-release.tar.gz .
          cp apps/utils/update_cluster.sh .
          sha256sum cluster-release.tar.gz > cluster-release.sha256

      - name: Copy release to the Swarm manager
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 10000
          source: cluster-release.tar.gz,cluster-release.sha256,update_cluster.sh
          target: /tmp/cluster-deploy-${{ github.sha }}

      - name: Install and deploy release
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 10000
          script: |
            set -eu
            deploy_dir=/tmp/cluster-deploy-${{ github.sha }}
            cd "$deploy_dir"
            chmod 0755 update_cluster.sh
            checksum=$(awk '{print $1}' cluster-release.sha256)
            ./update_cluster.sh cluster-release.tar.gz '${{ github.sha }}' "$checksum"
            cd /
            rm -rf -- "$deploy_dir"
